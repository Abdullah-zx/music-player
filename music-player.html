<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Late Groove — Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17121C;
    --bg-vignette: #211829;
    --surface: #241C2C;
    --surface-raised: #2C2333;
    --line: rgba(242,237,228,0.08);
    --amber: #E8A33D;
    --amber-dim: #B9822F;
    --rust: #C4574B;
    --ink: #F2EDE4;
    --ink-dim: #B9AFC4;
    --ink-faint: #7E7390;
    --groove: repeating-radial-gradient(circle at center, #171018 0px, #171018 2px, #1C141F 3px, #1C141F 4px);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse 900px 600px at 50% -10%, var(--bg-vignette), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family:'Inter', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 20px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  .rig{
    width:100%;
    max-width:920px;
    display:grid;
    grid-template-columns: 320px 1fr;
    gap:0;
    background: var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    overflow:hidden;
    box-shadow: 0 40px 80px -30px rgba(0,0,0,0.7), 0 0 0 1px rgba(0,0,0,0.2);
  }

  /* ---------- LEFT: DECK ---------- */
  .deck{
    position:relative;
    background:
      linear-gradient(180deg, #1A1420, #150F19);
    padding:36px 28px 28px;
    display:flex;
    flex-direction:column;
    align-items:center;
    border-right:1px solid var(--line);
  }

  .brand{
    align-self:flex-start;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:0.04em;
    color: var(--ink-dim);
    margin-bottom:26px;
    display:flex;
    align-items:baseline;
    gap:6px;
  }
  .brand span{ color: var(--amber); font-style:italic; }

  .platter-wrap{
    position:relative;
    width:236px;
    height:236px;
    margin-bottom:10px;
  }

  .platter{
    width:100%;
    height:100%;
    border-radius:50%;
    background: var(--groove);
    box-shadow:
      0 0 0 6px #0F0A12,
      0 20px 40px -14px rgba(0,0,0,0.8),
      inset 0 0 30px rgba(0,0,0,0.6);
    animation: spin 6s linear infinite;
    animation-play-state: paused;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .platter.spinning{ animation-play-state: running; }

  .label{
    width:96px;
    height:96px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--amber-dim), #7A5320 70%);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 0 0 0 2px rgba(0,0,0,0.4), inset 0 2px 6px rgba(255,255,255,0.15);
  }
  .label::after{
    content:'';
    width:10px; height:10px;
    background:#171018;
    border-radius:50%;
    box-shadow: 0 0 0 2px rgba(0,0,0,0.5);
  }

  @keyframes spin{ to{ transform: rotate(360deg); } }

  .tonearm{
    position:absolute;
    top:-14px;
    right:2px;
    width:96px;
    height:96px;
    transform-origin: 88px 8px;
    transform: rotate(-32deg);
    transition: transform 0.5s cubic-bezier(.4,0,.2,1);
    pointer-events:none;
  }
  .tonearm.playing{ transform: rotate(-6deg); }
  .tonearm svg{ width:100%; height:100%; overflow:visible; }

  .now-meta{
    text-align:center;
    margin-top:18px;
    width:100%;
  }
  .now-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:21px;
    line-height:1.25;
    letter-spacing:-0.01em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .now-artist{
    margin-top:5px;
    font-size:13px;
    color: var(--ink-faint);
    letter-spacing:0.03em;
  }

  .viz{
    display:flex;
    align-items:flex-end;
    gap:3px;
    height:22px;
    margin-top:16px;
  }
  .viz i{
    width:3px;
    background: var(--amber);
    border-radius:2px;
    height:4px;
    opacity:0.55;
    animation: bounce 1.1s ease-in-out infinite;
    animation-play-state: paused;
  }
  .viz.on i{ animation-play-state: running; }
  .viz i:nth-child(1){ animation-delay: -1.0s; }
  .viz i:nth-child(2){ animation-delay: -0.7s; }
  .viz i:nth-child(3){ animation-delay: -0.4s; }
  .viz i:nth-child(4){ animation-delay: -0.9s; }
  .viz i:nth-child(5){ animation-delay: -0.2s; }
  .viz i:nth-child(6){ animation-delay: -0.6s; }
  .viz i:nth-child(7){ animation-delay: -1.1s; }
  @keyframes bounce{
    0%,100%{ height:4px; opacity:0.45; }
    50%{ height:20px; opacity:1; }
  }

  /* ---------- RIGHT: CONTROLS ---------- */
  .panel{
    padding:34px 32px;
    display:flex;
    flex-direction:column;
    min-width:0;
  }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color: var(--ink-faint);
    margin-bottom:6px;
  }

  .progress-row{
    margin-top:24px;
  }
  .bars{
    display:flex;
    align-items:center;
    gap:2px;
    height:34px;
    cursor:pointer;
    width:100%;
  }
  .bars .bar{
    flex:1;
    background: var(--line);
    border-radius:1px;
    height:8px;
    transition: height 0.15s, background 0.15s;
  }
  .bars .bar.fill{ background: var(--amber); }
  .bars:hover .bar{ height:14px; }

  .time-row{
    display:flex;
    justify-content:space-between;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color: var(--ink-faint);
    margin-top:8px;
  }

  .transport{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    margin-top:30px;
  }
  .tbtn{
    background:none;
    border:none;
    color: var(--ink-dim);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8px;
    border-radius:50%;
    transition: color 0.15s, transform 0.1s, background 0.15s;
  }
  .tbtn:hover{ color: var(--ink); background: rgba(242,237,228,0.06); }
  .tbtn:active{ transform: scale(0.92); }
  .tbtn svg{ width:20px; height:20px; }

  .tbtn.toggle{
    color: var(--ink-dim);
  }
  .tbtn.toggle.active{ color: var(--amber); }

  .play-btn{
    width:56px; height:56px;
    border-radius:50%;
    background: var(--amber);
    color: #1A1420;
    display:flex;
    align-items:center;
    justify-content:center;
    border:none;
    cursor:pointer;
    box-shadow: 0 10px 24px -8px rgba(232,163,61,0.55);
    transition: transform 0.12s, box-shadow 0.15s;
  }
  .play-btn:hover{ box-shadow: 0 12px 28px -6px rgba(232,163,61,0.7); }
  .play-btn:active{ transform: scale(0.94); }
  .play-btn svg{ width:22px; height:22px; }

  .lower-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    margin-top:30px;
  }
  .volume{
    display:flex;
    align-items:center;
    gap:10px;
    flex:1;
    max-width:180px;
  }
  .volume svg{ width:16px; height:16px; color: var(--ink-faint); flex-shrink:0; }
  input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:4px;
    border-radius:2px;
    background: var(--line);
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:12px; height:12px;
    border-radius:50%;
    background: var(--ink);
    cursor:pointer;
    box-shadow: 0 0 0 3px rgba(242,237,228,0.12);
    transition: box-shadow 0.15s;
  }
  #volume::-webkit-slider-thumb{ background: var(--amber); }
  input[type="range"]::-moz-range-thumb{
    width:12px; height:12px; border-radius:50%;
    background: var(--amber); border:none; cursor:pointer;
  }

  .flags{
    display:flex;
    gap:6px;
  }

  /* ---------- PLAYLIST ---------- */
  .side-title{
    margin-top:34px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color: var(--ink-faint);
    border-bottom:1px solid var(--line);
    padding-bottom:10px;
  }

  .playlist{
    list-style:none;
    margin:6px 0 0;
    padding:0;
    max-height:230px;
    overflow-y:auto;
  }
  .playlist::-webkit-scrollbar{ width:6px; }
  .playlist::-webkit-scrollbar-thumb{ background: var(--line); border-radius:3px; }

  .track{
    display:flex;
    align-items:center;
    gap:14px;
    padding:10px 6px;
    border-radius:10px;
    cursor:pointer;
    transition: background 0.15s;
  }
  .track:hover{ background: var(--surface-raised); }
  .track.active{ background: var(--surface-raised); }

  .track-num{
    width:20px;
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color: var(--ink-faint);
    flex-shrink:0;
  }
  .track.active .track-num{ color: transparent; position:relative; }
  .track.active .track-num::after{
    content:'';
    position:absolute; inset:0;
    background: currentColor;
  }
  .eq-mini{
    display:none;
    align-items:flex-end;
    gap:2px;
    width:20px;
    height:14px;
    margin:0 auto;
  }
  .track.active .eq-mini{ display:flex; }
  .eq-mini i{
    width:3px;
    background: var(--amber);
    border-radius:1px;
    height:4px;
    animation: bounce 1.1s ease-in-out infinite;
  }
  .eq-mini i:nth-child(1){ animation-delay:-0.9s; }
  .eq-mini i:nth-child(2){ animation-delay:-0.4s; }
  .eq-mini i:nth-child(3){ animation-delay:-0.7s; }

  .track-info{ min-width:0; flex:1; }
  .track-title{
    font-size:13.5px;
    font-weight:500;
    color: var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .track.active .track-title{ color: var(--amber); }
  .track-artist{
    font-size:11.5px;
    color: var(--ink-faint);
    margin-top:1px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .track-dur{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color: var(--ink-faint);
    flex-shrink:0;
  }

  /* focus visibility */
  button:focus-visible, input:focus-visible, .track:focus-visible{
    outline:2px solid var(--amber);
    outline-offset:2px;
  }

  @media (max-width: 680px){
    .rig{ grid-template-columns:1fr; }
    .deck{ border-right:none; border-bottom:1px solid var(--line); padding-top:28px; }
    .platter-wrap{ width:190px; height:190px; }
    .label{ width:78px; height:78px; }
  }
</style>
</head>
<body>

<div class="rig">

  <!-- DECK -->
  <div class="deck">
    <div class="brand">Late&nbsp;Groove <span>lounge&nbsp;deck</span></div>

    <div class="platter-wrap">
      <div class="platter" id="platter">
        <div class="label"></div>
      </div>
      <div class="tonearm" id="tonearm">
        <svg viewBox="0 0 96 96" fill="none">
          <circle cx="88" cy="8" r="7" fill="#0F0A12" stroke="#3A2E42" stroke-width="2"/>
          <line x1="88" y1="8" x2="18" y2="70" stroke="#3A2E42" stroke-width="4" stroke-linecap="round"/>
          <path d="M18 70 L6 78 L14 88 L26 80 Z" fill="#0F0A12" stroke="#3A2E42" stroke-width="2"/>
        </svg>
      </div>
    </div>

    <div class="now-meta">
      <div class="now-title" id="nowTitle">—</div>
      <div class="now-artist" id="nowArtist">—</div>
    </div>

    <div class="viz" id="viz">
      <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
  </div>

  <!-- PANEL -->
  <div class="panel">
    <div class="eyebrow" id="statusLine">Paused · Track 1 of 8</div>

    <div class="progress-row">
      <div class="bars" id="bars" role="slider" aria-label="Seek" tabindex="0"></div>
      <div class="time-row">
        <span id="curTime">0:00</span>
        <span id="durTime">0:00</span>
      </div>
    </div>

    <div class="transport">
      <button class="tbtn toggle" id="shuffleBtn" title="Shuffle" aria-label="Toggle shuffle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
      </button>
      <button class="tbtn" id="prevBtn" title="Previous" aria-label="Previous track">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM10 12l9-6v12z"/></svg>
      </button>
      <button class="play-btn" id="playBtn" title="Play" aria-label="Play or pause">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="tbtn" id="nextBtn" title="Next" aria-label="Next track">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM5 6l9 6-9 6z"/></svg>
      </button>
      <button class="tbtn toggle" id="repeatBtn" title="Repeat" aria-label="Toggle repeat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>
    </div>

    <div class="lower-row">
      <div class="volume">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3z"/></svg>
        <input type="range" id="volume" min="0" max="100" value="70" aria-label="Volume">
      </div>
    </div>

    <div class="side-title">
      <span>Playlist</span>
      <span id="playlistCount">8 tracks</span>
    </div>
    <ul class="playlist" id="playlist"></ul>
  </div>

</div>

<audio id="audio" preload="metadata"></audio>

<script>
(function(){
  const tracks = [
    { title:"Amber Static",      artist:"Nightbloom Trio",     src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
    { title:"Slow Neon",         artist:"Kōji Aoyama",         src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
    { title:"Corner Booth",      artist:"The Low Fidelities",  src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" },
    { title:"Velvet Rewind",     artist:"Marta Solene",        src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" },
    { title:"Streetlight Haze",  artist:"Nightbloom Trio",     src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3" },
    { title:"Analog Heart",      artist:"Ruth & The Radios",   src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3" },
    { title:"After Hours Reprise", artist:"Kōji Aoyama",       src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3" },
    { title:"Last Call",         artist:"The Low Fidelities",  src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" }
  ];

  const audio        = document.getElementById('audio');
  const playBtn       = document.getElementById('playBtn');
  const playIcon       = document.getElementById('playIcon');
  const prevBtn       = document.getElementById('prevBtn');
  const nextBtn       = document.getElementById('nextBtn');
  const shuffleBtn    = document.getElementById('shuffleBtn');
  const repeatBtn     = document.getElementById('repeatBtn');
  const barsEl        = document.getElementById('bars');
  const curTimeEl     = document.getElementById('curTime');
  const durTimeEl     = document.getElementById('durTime');
  const nowTitle      = document.getElementById('nowTitle');
  const nowArtist     = document.getElementById('nowArtist');
  const statusLine    = document.getElementById('statusLine');
  const platter       = document.getElementById('platter');
  const tonearm       = document.getElementById('tonearm');
  const viz           = document.getElementById('viz');
  const volumeInput   = document.getElementById('volume');
  const playlistEl    = document.getElementById('playlist');
  const playlistCount = document.getElementById('playlistCount');

  const ICON_PLAY  = '<path d="M8 5v14l11-7z"/>';
  const ICON_PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';

  const BAR_COUNT = 48;
  let current = 0;
  let isPlaying = false;
  let shuffle = false;
  let repeat = false; // repeat-one

  function fmt(s){
    if(!isFinite(s) || s < 0) s = 0;
    const m = Math.floor(s/60);
    const sec = Math.floor(s%60).toString().padStart(2,'0');
    return `${m}:${sec}`;
  }

  // build seek bars
  for(let i=0;i<BAR_COUNT;i++){
    const b = document.createElement('div');
    b.className = 'bar';
    barsEl.appendChild(b);
  }
  const barEls = Array.from(barsEl.children);

  function renderPlaylist(){
    playlistEl.innerHTML = '';
    playlistCount.textContent = `${tracks.length} tracks`;
    tracks.forEach((t, i) => {
      const li = document.createElement('li');
      li.className = 'track' + (i === current ? ' active' : '');
      li.tabIndex = 0;
      li.innerHTML = `
        <span class="track-num">${i+1}</span>
        <span class="eq-mini"><i></i><i></i><i></i></span>
        <span class="track-info">
          <div class="track-title">${t.title}</div>
          <div class="track-artist">${t.artist}</div>
        </span>
        <span class="track-dur" data-dur="${i}">--:--</span>
      `;
      li.addEventListener('click', () => loadTrack(i, true));
      li.addEventListener('keydown', (e) => { if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); loadTrack(i, true); } });
      playlistEl.appendChild(li);
    });
  }

  function setActiveRow(){
    Array.from(playlistEl.children).forEach((li, i) => {
      li.classList.toggle('active', i === current);
    });
  }

  function loadTrack(index, autoplay){
    current = (index + tracks.length) % tracks.length;
    const t = tracks[current];
    audio.src = t.src;
    nowTitle.textContent = t.title;
    nowArtist.textContent = t.artist;
    setActiveRow();
    updateStatus();
    if(autoplay){
      play();
    } else {
      pause();
    }
  }

  function play(){
    audio.play().then(() => {
      isPlaying = true;
      playIcon.innerHTML = ICON_PAUSE;
      playBtn.title = 'Pause';
      platter.classList.add('spinning');
      tonearm.classList.add('playing');
      viz.classList.add('on');
      updateStatus();
    }).catch(() => {
      // autoplay might be blocked before first user gesture
      isPlaying = false;
    });
  }

  function pause(){
    audio.pause();
    isPlaying = false;
    playIcon.innerHTML = ICON_PLAY;
    playBtn.title = 'Play';
    platter.classList.remove('spinning');
    tonearm.classList.remove('playing');
    viz.classList.remove('on');
    updateStatus();
  }

  function togglePlay(){
    if(!audio.src){ loadTrack(0, true); return; }
    isPlaying ? pause() : play();
  }

  function updateStatus(){
    statusLine.textContent = `${isPlaying ? 'Playing' : 'Paused'} · Track ${current+1} of ${tracks.length}${shuffle ? ' · Shuffle' : ''}${repeat ? ' · Repeat' : ''}`;
  }

  function nextTrack(userTriggered){
    if(shuffle){
      let r;
      do { r = Math.floor(Math.random() * tracks.length); } while(tracks.length > 1 && r === current);
      loadTrack(r, true);
    } else {
      loadTrack(current + 1, true);
    }
  }

  function prevTrack(){
    // if more than 3s in, restart current track instead of going back
    if(audio.currentTime > 3){
      audio.currentTime = 0;
      return;
    }
    loadTrack(current - 1, true);
  }

  // progress + seek bars
  function renderProgress(){
    const dur = audio.duration || 0;
    const cur = audio.currentTime || 0;
    const ratio = dur ? cur / dur : 0;
    const filledCount = Math.round(ratio * BAR_COUNT);
    barEls.forEach((b, i) => b.classList.toggle('fill', i < filledCount));
    curTimeEl.textContent = fmt(cur);
    durTimeEl.textContent = fmt(dur);
  }

  function seekFromClientX(clientX){
    const rect = barsEl.getBoundingClientRect();
    let ratio = (clientX - rect.left) / rect.width;
    ratio = Math.min(1, Math.max(0, ratio));
    if(audio.duration){
      audio.currentTime = ratio * audio.duration;
      renderProgress();
    }
  }

  let dragging = false;
  barsEl.addEventListener('mousedown', (e) => { dragging = true; seekFromClientX(e.clientX); });
  window.addEventListener('mousemove', (e) => { if(dragging) seekFromClientX(e.clientX); });
  window.addEventListener('mouseup', () => dragging = false);
  barsEl.addEventListener('touchstart', (e) => { dragging = true; seekFromClientX(e.touches[0].clientX); });
  barsEl.addEventListener('touchmove', (e) => { if(dragging) seekFromClientX(e.touches[0].clientX); });
  window.addEventListener('touchend', () => dragging = false);
  barsEl.addEventListener('keydown', (e) => {
    if(!audio.duration) return;
    if(e.key === 'ArrowRight'){ audio.currentTime = Math.min(audio.duration, audio.currentTime + 5); }
    if(e.key === 'ArrowLeft'){ audio.currentTime = Math.max(0, audio.currentTime - 5); }
  });

  audio.addEventListener('timeupdate', renderProgress);
  audio.addEventListener('loadedmetadata', () => {
    renderProgress();
    const durEl = playlistEl.querySelector(`[data-dur="${current}"]`);
    if(durEl) durEl.textContent = fmt(audio.duration);
  });

  audio.addEventListener('ended', () => {
    if(repeat){
      audio.currentTime = 0;
      play();
    } else {
      nextTrack(false);
    }
  });

  // controls
  playBtn.addEventListener('click', togglePlay);
  nextBtn.addEventListener('click', () => nextTrack(true));
  prevBtn.addEventListener('click', prevTrack);
  shuffleBtn.addEventListener('click', () => {
    shuffle = !shuffle;
    shuffleBtn.classList.toggle('active', shuffle);
    updateStatus();
  });
  repeatBtn.addEventListener('click', () => {
    repeat = !repeat;
    repeatBtn.classList.toggle('active', repeat);
    updateStatus();
  });
  volumeInput.addEventListener('input', () => {
    audio.volume = volumeInput.value / 100;
  });

  // keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if(e.target.tagName === 'INPUT') return;
    if(e.code === 'Space'){ e.preventDefault(); togglePlay(); }
    if(e.code === 'ArrowRight' && e.shiftKey){ nextTrack(true); }
    if(e.code === 'ArrowLeft' && e.shiftKey){ prevTrack(); }
  });

  // init
  audio.volume = volumeInput.value / 100;
  renderPlaylist();
  loadTrack(0, false);

  // preload durations for the list (lightweight metadata fetch)
  tracks.forEach((t, i) => {
    const probe = new Audio();
    probe.preload = 'metadata';
    probe.src = t.src;
    probe.addEventListener('loadedmetadata', () => {
      const el = playlistEl.querySelector(`[data-dur="${i}"]`);
      if(el) el.textContent = fmt(probe.duration);
    });
  });
})();
</script>

</body>
</html>
