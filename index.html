<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Late Groove | Spotify Player</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="login-screen">

    <div class="login-card">

      <div class="login-logo">
        Late Groove
      </div>

      <p>
        Connect your Spotify account to start listening.
      </p>

      <button id="loginBtn" class="spotify-login">
        Login with Spotify
      </button>

      <small id="loginStatus">
        Spotify Premium is required for Web Playback.
      </small>

    </div>

  </div>


  <!-- PLAYER -->
  <div class="rig" id="playerApp" style="display:none;">

    <!-- DECK -->
    <div class="deck">

      <div class="brand">
        Late&nbsp;Groove
        <span>lounge&nbsp;deck</span>
      </div>

      <div class="platter-wrap">

        <div class="platter" id="platter">
          <div class="label"></div>
        </div>

        <div class="tonearm" id="tonearm">

          <svg viewBox="0 0 96 96" fill="none">

            <circle
              cx="88"
              cy="8"
              r="7"
              fill="#0F0A12"
              stroke="#3A2E42"
              stroke-width="2"
            />

            <line
              x1="88"
              y1="8"
              x2="18"
              y2="70"
              stroke="#3A2E42"
              stroke-width="4"
              stroke-linecap="round"
            />

            <path
              d="M18 70 L6 78 L14 88 L26 80 Z"
              fill="#0F0A12"
              stroke="#3A2E42"
              stroke-width="2"
            />

          </svg>

        </div>

      </div>


      <div class="now-meta">

        <div class="now-title" id="nowTitle">
          Spotify Player
        </div>

        <div class="now-artist" id="nowArtist">
          Connect Spotify
        </div>

      </div>


      <div class="viz" id="viz">
        <i></i>
        <i></i>
        <i></i>
        <i></i>
        <i></i>
        <i></i>
        <i></i>
      </div>

    </div>


    <!-- PANEL -->
    <div class="panel">

      <div class="eyebrow" id="statusLine">
        Connecting to Spotify...
      </div>


      <!-- SEARCH -->
      <div class="spotify-search">

        <input
          type="text"
          id="searchInput"
          placeholder="Search Spotify..."
          autocomplete="off"
        >

        <button id="searchBtn">
          Search
        </button>

      </div>


      <!-- SEARCH RESULTS -->
      <div
        id="searchResults"
        class="search-results"
      ></div>


      <!-- PROGRESS -->
      <div class="progress-row">

        <div
          class="bars"
          id="bars"
          role="slider"
          aria-label="Seek"
          tabindex="0"
        ></div>

        <div class="time-row">

          <span id="curTime">
            0:00
          </span>

          <span id="durTime">
            0:00
          </span>

        </div>

      </div>


      <!-- CONTROLS -->
      <div class="transport">

        <button
          class="tbtn toggle"
          id="shuffleBtn"
          title="Shuffle"
          aria-label="Shuffle"
        >
          ⇄
        </button>


        <button
          class="tbtn"
          id="prevBtn"
          title="Previous"
          aria-label="Previous"
        >
          ◀
        </button>


        <button
          class="play-btn"
          id="playBtn"
          title="Play"
          aria-label="Play or pause"
        >

          <svg
            id="playIcon"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path d="M8 5v14l11-7z" />
          </svg>

        </button>


        <button
          class="tbtn"
          id="nextBtn"
          title="Next"
          aria-label="Next"
        >
          ▶
        </button>


        <button
          class="tbtn toggle"
          id="repeatBtn"
          title="Repeat"
          aria-label="Repeat"
        >
          ↻
        </button>

      </div>


      <!-- VOLUME -->
      <div class="lower-row">

        <div class="volume">

          <span>🔊</span>

          <input
            type="range"
            id="volume"
            min="0"
            max="100"
            value="70"
            aria-label="Volume"
          >

        </div>

      </div>


      <!-- PLAYLIST -->
      <div class="side-title">

        <span>
          Spotify Search
        </span>

        <span id="playlistCount">
          Ready
        </span>

      </div>


      <ul
        class="playlist"
        id="playlist"
      ></ul>

    </div>

  </div>


  <!-- AUDIO -->
  <audio id="audio"></audio>


  <!-- IMPORTANT: SPOTIFY SDK MUST LOAD BEFORE script.js -->

  <script src="https://sdk.scdn.co/spotify-player.js"></script>

  <script>
    window.onSpotifyWebPlaybackSDKReady = function () {
      console.log("Spotify Web Playback SDK loaded successfully.");

      window.spotifySDKReady = true;

      document.dispatchEvent(
        new Event("spotify-sdk-ready")
      );
    };
  </script>


  <!-- YOUR JAVASCRIPT -->

<script src="https://sdk.scdn.co/spotify-player.js"></script>
<script src="script.js"></script>

</body>

</html>
